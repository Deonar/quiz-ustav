<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест зі статутів ЗСУ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Тест зі статутів ЗСУ</h1>
    <p class="muted">ДС ст. 1–6 · СВС ст. 28–32, 35–38, 49–57, 119–120 · БСА ч. 2 (командир взводу)</p>
  </header>

  <!-- Налаштування -->
  <section id="setup" class="card">
    <h2>Розділи</h2>
    <div id="sections" class="checks"></div>
    <div class="row">
      <label>Кількість питань
        <select id="count">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="30">30</option>
          <option value="0">Усі</option>
        </select>
      </label>
      <label>Режим
        <select id="mode">
          <option value="study">Навчання (відповідь одразу)</option>
          <option value="exam">Іспит (результат у кінці)</option>
        </select>
      </label>
    </div>
    <label class="inline"><input type="checkbox" id="timer"> Обмеження часу (1 хв на питання)</label>
    <label class="field">ПІБ / підрозділ (необов'язково)
      <input type="text" id="name" placeholder="напр. сол. Петренко І.І., 1 взвод">
    </label>
    <button id="start" class="btn primary">Почати тест</button>
    <p class="note">Питання складено за текстами Дисциплінарного статуту, Статуту внутрішньої служби ЗСУ та Бойового статуту. Звіряйте з чинною редакцією.</p>
  </section>

  <!-- Питання -->
  <section id="quiz" class="card hidden">
    <div class="bar">
      <span id="progress"></span>
      <span id="clock"></span>
    </div>
    <div class="track"><div id="trackFill"></div></div>
    <p id="secTitle" class="muted small"></p>
    <h2 id="question"></h2>
    <div id="answers" class="answers"></div>
    <div id="explain" class="explain hidden"></div>
    <div class="row end">
      <button id="next" class="btn primary" disabled>Далі</button>
    </div>
  </section>

  <!-- Результат -->
  <section id="result" class="card hidden">
    <h2>Результат</h2>
    <div id="score" class="score"></div>
    <div id="bySection"></div>
    <div class="row">
      <button id="retryWrong" class="btn">Повторити помилки</button>
      <button id="restart" class="btn primary">Новий тест</button>
      <button id="print" class="btn">Друк</button>
    </div>
    <h3>Розбір</h3>
    <ol id="review" class="review"></ol>
  </section>
</main>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
